[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "p-x402"
version = "0.1.0"
description = "Python client for p-x402: pay HTTP 402 Payment Required responses with Pix (x402 v2)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.25,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]

[project.optional-dependencies]
fastapi = ["starlette>=0.27"]
dev = ["pytest>=7", "fastapi>=0.100", "uvicorn>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
px402 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# B008: FastAPI's Depends(...) in argument defaults is the framework's idiom.
ignore = ["B008"]
